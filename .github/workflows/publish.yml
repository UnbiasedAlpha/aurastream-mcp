# Publishes to PyPI when a GitHub release is published, using PyPI trusted publishing (no token stored here),
# then lists the release in the MCP registry (registry.modelcontextprotocol.io) with GitHub OIDC.
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # The registry checks the mcp-name line in the PyPI README, so wait until PyPI serves the new version.
      - name: Wait for PyPI
        run: |
          v=${GITHUB_REF_NAME#v}
          for i in $(seq 30); do
            curl -sf "https://pypi.org/pypi/aurastream-mcp/$v/json" >/dev/null && exit 0
            sleep 10
          done
          exit 1
      - name: Set version in server.json
        run: |
          v=${GITHUB_REF_NAME#v}
          jq --arg v "$v" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
      - name: Install mcp-publisher
        run: curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
