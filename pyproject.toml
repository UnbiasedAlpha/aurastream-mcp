[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aurastream-mcp"
version = "0.1.0"
description = "MCP server for AuraStream: historical market data for Claude, ChatGPT and other MCP clients."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Unbiased Alpha", email = "marco.santanche@unbiased-alpha.com" }]
keywords = ["mcp", "market data", "aurastream", "claude", "trading"]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
aurastream-mcp = "aurastream_mcp.server:main"

[project.urls]
Homepage = "https://aurastream.unbiased-alpha.com"
Documentation = "https://aurastream.unbiased-alpha.com/docs/"

[tool.hatch.build.targets.wheel]
packages = ["src/aurastream_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
